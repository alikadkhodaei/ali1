name: Download TeXstudio

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Create folder
        run: mkdir -p downloaded

      - name: Download TeXstudio EXE
        run: |
          curl -L "https://github.com/texstudio-org/texstudio/releases/download/4.9.2/texstudio-4.9.2-win-qt6-signed.exe" \
               -o downloaded/texstudio.exe

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: texstudio-windows
          path: downloaded/texstudio.exe

